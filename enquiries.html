        <!--Navigation menu for users to navigate the website with ease-->

        <ul>
            <p><h2>Navigation Menu:</h2></p>

    <main>
        <form id="enquiryForm" class="form">
            <label>Your name<input id="name" type="text" placeholder="Enter your name" required></label>
            <label>Email address<input id="email" type="email" placeholder="Enter your name" required></label>
            <label>Your message<textarea id="message" placeholder="Tell us how we can help..." rows="5" required></textarea></label>
            <button class="btn gold" type="submit">Send enquiry</button>
            <p id="formMessage"></p>
        </form>

        <script>
            function validateForm(){
                let x = document.forms["enquiryForm"]["fname"].value;
                if (x == "") {
                    alert("Information needs to be filled out!");
                    return false;
                }
            }
        </script>

        <form name ="contactForm" action="/enquiries.html" onsubmit="return validateForm()" method="post">
            Contact information: <input id="submit" placeholder="number" name="fname">
        </form>
    </main>
